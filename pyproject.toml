[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "raglab-experiments"
version = "0.4.0"
description = "Composable RAG technique playground"
authors = [
    {name = "Your Full Name", email = "caoxen7ys@yahoo.com"}
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["langchain-core>=0.3", "langchain-openai>=0.3", "langchain-chroma>=0.2", "langchain-text-splitters>=0.3", "python-dotenv>=1", "streamlit>=1.35", "pydantic>=2", "PyYAML>=6"]
[project.scripts]
raglab = "raglab.cli:main"
[tool.setuptools.packages.find]
include = ["raglab*"]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3"]
documents = ["pymupdf>=1.24", "python-docx>=1.1", "openpyxl>=3.1", "xlrd>=2.0", "beautifulsoup4>=4.12"]
viz = ["numpy>=1.24", "pandas>=2", "scikit-learn>=1.3", "umap-learn>=0.5.5", "plotly>=5.18"]
